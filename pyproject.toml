[project]
name = "rfq-bench"
version = "0.1.0"
description = "A reproducible benchmark for AI agents that negotiate B2B deals: strategies, self-play and model duels, scored on immutable traces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lukas Rump", email = "l.rump@shopware.com" }]
maintainers = [{ name = "Shopware AG" }]
keywords = ["negotiation", "benchmark", "llm", "agents", "e-commerce", "b2b", "negmas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # NegMAS is the negotiation engine: SAOMechanism, protocol, deadlines, lifecycle.
    "negmas>=0.16.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.30",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/agentic-commerce-lab/rfq-bench"
Documentation = "https://github.com/agentic-commerce-lab/rfq-bench/tree/main/docs"
Issues = "https://github.com/agentic-commerce-lab/rfq-bench/issues"

[project.scripts]
rfq-bench = "rfq_bench.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfq_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/rfq_bench"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["negmas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that require a live OpenAI-compatible endpoint (deselect with '-m \"not llm\"')",
]
