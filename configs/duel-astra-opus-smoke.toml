# Model duel SMOKE TEST — GPT-6 Astra vs Claude Opus 5.5, 4 episodes.
#
# Run with:   uv run rfq-bench run --config configs/duel-astra-opus-smoke.toml
# Score with: uv run rfq-bench report --config configs/duel-astra-opus-smoke.toml
#
# Purpose: check the plumbing before the full duel (configs/duel-astra-opus.toml):
# both models answer with a tool call, no errors/re-ask storms, costs look sane.
# NOT a result — one scenario gives no CI.
#
# Matrix: 1 scenario × control × neutral × 2 first speakers × 1 seed × 2 pairings (cross)
#       = 4 episodes: Astra sells to Opus and Opus sells to Astra, each opening order.
#
# tool_choice and the other decoding settings are pinned in [llm] below. Model ids are pinned (not the ~latest alias).

[run]
agent       = "duel"
data        = "data/scenarios_price"
models      = ["openai/gpt-6-astra", "anthropic/claude-opus-5.5"]
pairings    = "cross"

scenarios      = ["price_wide_sym"]
strategies     = ["control"]
personas       = ["neutral"]
first_speakers = ["buyer", "seller"]
seeds          = [0]

concurrency = 4
retries     = 2
overwrite   = true                       # a smoke test is disposable: each run replaces it

out           = "results/duel_astra_opus_smoke.jsonl"
dashboard     = true
dashboard_out = "results/duel_astra_opus_smoke_dashboard.html"

[llm]
# The decoding condition, pinned so the run does not depend on .env. These are the
# values the 2026-09-24 duels ran with (recorded in their traces). tool_choice
# must stay "auto": Claude with extended thinking rejects forced tool calls, and
# both models must use the same protocol.
temperature = 0.0
max_tokens  = 4096
seed        = 7
tool_choice = "auto"
max_reasks  = 2
strict_tool = false

[dashboard]
n_boot = 2000
seed   = 0
